name: Test and deploy to GitHub Pages

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  fast:
    name: Fast headless gate
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: lts/*

      - name: Run fast headless simulation tests
        run: node --test tests/headless/*.test.js

  focused:
    name: Focused Chromium PR gate
    if: ${{ github.event_name == 'pull_request' }}
    needs: fast
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: lts/*

      - name: Select focused browser tests
        id: focused
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          CHANGED_FILES="$(git diff --name-only "$BASE_SHA" "$HEAD_SHA")"
          printf '%s\n' "$CHANGED_FILES"
          TEST_FILES="$(printf '%s\n' "$CHANGED_FILES" | node scripts/select-focused-tests.js)"
          echo "Focused Playwright set: $TEST_FILES"
          echo "test_files=$TEST_FILES" >> "$GITHUB_OUTPUT"

      - name: Install test dependencies
        run: npm install --no-audit --no-fund

      - name: Verify preinstalled Chrome
        run: google-chrome --version

      - name: Run focused Playwright tests
        env:
          TEST_FILES: ${{ steps.focused.outputs.test_files }}
          CI_RELEASE: '0'
          CI_SYSTEM_CHROME: '1'
        run: npx playwright test $TEST_FILES --project=chromium

      - name: Upload Playwright failure report
        if: ${{ failure() }}
        uses: actions/upload-artifact@v5
        with:
          name: playwright-report-${{ github.run_id }}
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
          retention-days: 14

  release:
    name: Full Chromium release gate
    if: ${{ github.event_name != 'pull_request' }}
    needs: fast
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: lts/*

      - name: Install test dependencies
        run: npm install --no-audit --no-fund

      - name: Verify preinstalled Chrome
        run: google-chrome --version

      - name: Run full Playwright release suite
        env:
          CI_RELEASE: '1'
          CI_SYSTEM_CHROME: '1'
        run: npm run test:e2e

      - name: Upload Playwright failure report
        if: ${{ failure() }}
        uses: actions/upload-artifact@v5
        with:
          name: playwright-report-${{ github.run_id }}
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
          retention-days: 14

  deploy:
    name: Deploy GitHub Pages
    if: ${{ github.event_name != 'pull_request' }}
    needs: [fast, release]
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload site
        uses: actions/upload-pages-artifact@v4
        with:
          path: .

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
