name: Test and deploy to GitHub Pages

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  fast:
    name: Fast headless gate
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: lts/*

      - name: Audit complete JavaScript codebase and run headless simulation tests
        run: npm run test:fast

  focused:
    name: Focused Chromium gate
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: lts/*

      - name: Select focused browser tests
        id: focused
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          ZERO_SHA="0000000000000000000000000000000000000000"
          if [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ] || [ -z "$BASE_SHA" ] || [ "$BASE_SHA" = "$ZERO_SHA" ]; then
            CHANGED_FILES="$(printf '%s\n' index.html src/foundation/version.js src/foundation/runtime.js src/simulation-api.js)"
          else
            CHANGED_FILES="$(git diff --name-only "$BASE_SHA" "$HEAD_SHA")"
          fi
          printf '%s\n' "$CHANGED_FILES"
          TEST_FILES="$(printf '%s\n' "$CHANGED_FILES" | node scripts/select-focused-tests.js)"
          echo "Focused Playwright set: $TEST_FILES"
          echo "test_files=$TEST_FILES" >> "$GITHUB_OUTPUT"

      - name: Install test dependencies
        run: npm install --no-audit --no-fund

      - name: Verify preinstalled Chrome
        run: google-chrome --version

      - name: Run focused Playwright tests
        env:
          TEST_FILES: ${{ steps.focused.outputs.test_files }}
          CI_RELEASE: '0'
          CI_SYSTEM_CHROME: '1'
        run: npx playwright test $TEST_FILES --project=chromium

      - name: Upload Playwright failure report
        if: ${{ failure() }}
        uses: actions/upload-artifact@v5
        with:
          name: playwright-report-${{ github.run_id }}
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
          retention-days: 14

  health:
    name: Game health 520-unit gate
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: lts/*

      - name: Install test dependencies
        run: npm install --no-audit --no-fund

      - name: Verify preinstalled Chrome
        run: google-chrome --version

      - name: Run automated game health scenario
        env:
          CI_RELEASE: '0'
          CI_SYSTEM_CHROME: '1'
        run: npx playwright test tests/game-health-observer.spec.js --project=chromium --workers=1

      - name: Upload game health report
        if: ${{ always() }}
        uses: actions/upload-artifact@v5
        with:
          name: game-health-${{ github.run_id }}
          path: test-results/game-health-report.json
          if-no-files-found: ignore
          retention-days: 30

      - name: Upload game health failure report
        if: ${{ failure() }}
        uses: actions/upload-artifact@v5
        with:
          name: game-health-playwright-${{ github.run_id }}
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
          retention-days: 14

  release:
    name: Full Chromium release gate (${{ matrix.shard }}/2)
    if: ${{ github.event_name == 'workflow_dispatch' || (github.event_name == 'pull_request' && startsWith(github.head_ref, 'release/')) }}
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: lts/*

      - name: Install test dependencies
        run: npm install --no-audit --no-fund

      - name: Verify preinstalled Chrome
        run: google-chrome --version

      - name: Run Playwright release shard
        env:
          CI_RELEASE: '1'
          CI_SYSTEM_CHROME: '1'
        run: npx playwright test --project=chromium --shard=${{ matrix.shard }}/2

      - name: Upload Playwright failure report
        if: ${{ failure() }}
        uses: actions/upload-artifact@v5
        with:
          name: playwright-report-${{ github.run_id }}-shard-${{ matrix.shard }}
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
          retention-days: 14

  deploy:
    name: Deploy GitHub Pages
    if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
    needs: [fast, focused, health]
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload site
        uses: actions/upload-pages-artifact@v4
        with:
          path: .

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
