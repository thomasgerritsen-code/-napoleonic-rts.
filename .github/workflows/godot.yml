name: Godot

# The Godot version of the game (godot/): imports the project, runs the
# headless battle check, and exports a Windows .exe kept with the run. A
# passing build from this repository is also put on the release
# "godot-latest" with its version.json, where the game's in-game updater
# (godot/scripts/updater.gd) finds it.
on:
  workflow_dispatch:
  push:
    branches: ["main"]
    paths: ["godot/**", ".github/workflows/godot.yml"]
  pull_request:
    paths: ["godot/**", ".github/workflows/godot.yml"]

permissions:
  contents: write

concurrency:
  group: godot-${{ github.ref }}
  cancel-in-progress: true

env:
  GODOT_VERSION: 4.7.1

jobs:
  godot:
    name: Godot check and Windows export
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Download Godot
        run: |
          base="https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable"
          curl -sSL -o godot.zip "$base/Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip"
          unzip -q godot.zip
          mv "Godot_v${GODOT_VERSION}-stable_linux.x86_64" "$RUNNER_TEMP/godot"
          rm godot.zip
          "$RUNNER_TEMP/godot" --version

      - name: Import the project
        run: |
          # Script errors are reported per script in the next step.
          timeout 300 "$RUNNER_TEMP/godot" --headless --path godot --import 2>&1 | tee import.log

      - name: Check every script
        run: |
          failed=0
          for f in godot/scripts/*.gd godot/tests/*.gd; do
            out=$(timeout 60 "$RUNNER_TEMP/godot" --headless --path godot --check-only --script "res://${f#godot/}" 2>&1 || true)
            if echo "$out" | grep -E "SCRIPT ERROR|Parse Error"; then echo "^^ in $f"; failed=1; fi
          done
          exit $failed

      - name: Headless battle check
        run: |
          set -o pipefail
          timeout 300 "$RUNNER_TEMP/godot" --headless --path godot --script res://tests/smoke_test.gd 2>&1 | tee smoke.log
          if grep -E "SCRIPT ERROR|Parse Error|ERROR:" smoke.log | grep -v "still in use at exit"; then exit 1; fi
          grep -q "GODOT_SMOKE" smoke.log

      - name: Screenshots with a real renderer
        continue-on-error: true
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq xvfb > /dev/null
          mkdir -p shots
          SHOT_DIR="$PWD/shots" timeout 300 xvfb-run -a -s "-screen 0 1600x900x24" \
            "$RUNNER_TEMP/godot" --path godot --rendering-driver opengl3 --resolution 1600x900 --script res://tests/screenshot.gd 2>&1 | tail -20
          ls -la shots

      - name: Publish the screenshots
        if: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}
        continue-on-error: true
        uses: softprops/action-gh-release@v2
        with:
          tag_name: godot-screens
          name: Godot-schermafbeeldingen
          target_commitish: ${{ github.event.pull_request.head.sha || github.sha }}
          body: Schermafbeeldingen van de Godot-versie uit de laatste geslaagde controle (om te zien wat de test zonder scherm niet ziet).
          prerelease: true
          make_latest: false
          files: shots/*.png

      - name: Install export templates
        run: |
          base="https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable"
          curl -sSL -o templates.tpz "$base/Godot_v${GODOT_VERSION}-stable_export_templates.tpz"
          dir="$HOME/.local/share/godot/export_templates/${GODOT_VERSION}.stable"
          mkdir -p "$dir"
          unzip -q -j templates.tpz "templates/windows_release_x86_64.exe" "templates/version.txt" -d "$dir"
          rm templates.tpz

      - name: Stamp the build number
        env:
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          printf '{"build": %s, "commit": "%s", "date": "%s"}\n' "${{ github.run_number }}" "${HEAD_SHA::7}" "$(date -u +%Y-%m-%d)" > godot/version.json
          cat godot/version.json

      - name: Export Windows .exe
        run: |
          mkdir -p godot/build
          timeout 600 "$RUNNER_TEMP/godot" --headless --path godot --export-release "Windows Desktop" build/NapoleonicRTS.exe 2>&1 | tee export.log
          ls -la godot/build
          test -s godot/build/NapoleonicRTS.exe

      - name: Keep the .exe with this run
        uses: actions/upload-artifact@v5
        with:
          name: Napoleonic-RTS-Godot-Windows
          path: godot/build/NapoleonicRTS.exe
          if-no-files-found: error
          retention-days: 30

      - name: Publish for the in-game updater
        if: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}
        uses: softprops/action-gh-release@v2
        with:
          tag_name: godot-latest
          name: Godot-versie (nieuwste)
          target_commitish: ${{ github.event.pull_request.head.sha || github.sha }}
          body: De Godot-versie van Napoleonic RTS voor Windows, na elke geslaagde controle bijgewerkt. Download NapoleonicRTS.exe en start het; het spel werkt zichzelf daarna bij via het menu.
          prerelease: false
          make_latest: false
          files: |
            godot/build/NapoleonicRTS.exe
            godot/version.json
