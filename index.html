<!doctype html>
<html lang="nl">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <meta name="theme-color" content="#111b18" />
  <title>Napoleonic RTS v1.4.7</title>
  <script>
    // Keep existing invitations and explicit simulation/debug links working.
    const entry = new URLSearchParams(location.search);
    if (entry.has('test') || entry.has('room')) {
      const game = new URL('play.html', location.href);
      game.search = location.search; game.hash = location.hash;
      if (entry.has('room')) { game.searchParams.set('mode', 'multiplayer'); game.searchParams.set('view', 'iso'); }
      location.replace(game.href);
    }
  </script>
  <link rel="stylesheet" href="src/menu/start-menu.css?build=147menu" />
</head>
<body>
  <main class="start-screen" aria-labelledby="game-title">
    <header class="start-brand">
      <span class="start-emblem" aria-hidden="true">N</span>
      <p class="start-eyebrow">Het slagveld wacht</p>
      <h1 id="game-title">NAPOLEONIC <span>RTS</span></h1>
      <p class="start-intro">Kies je veldslag.</p>
    </header>
    <nav class="start-modes" aria-label="Spelvorm kiezen">
      <a class="mode-card" id="startSingleplayer" href="play.html?view=iso&amp;mode=singleplayer&amp;v=147">
        <span class="mode-icon" aria-hidden="true">⚔</span>
        <span class="mode-title">Singleplayer</span>
        <span class="mode-description">Leid je leger tegen de computer.</span>
        <span class="mode-action">Start de veldslag <span aria-hidden="true">→</span></span>
      </a>
      <a class="mode-card" id="startMultiplayer" href="play.html?view=iso&amp;mode=multiplayer&amp;v=147">
        <span class="mode-icon" aria-hidden="true">⚑</span>
        <span class="mode-title">Multiplayer</span>
        <span class="mode-description">Host een kamer of sluit je aan bij een andere speler.</span>
        <span class="mode-action">Open de lobby <span aria-hidden="true">→</span></span>
      </a>
    </nav>
    <footer class="start-footer"><span>Frankrijk · Groot-Brittannië</span><span class="version">v1.4.7</span></footer>
  </main>
  <script src="src/foundation/deployment-info.js?build=local"></script>
  <script src="src/foundation/version.js?build=147menu"></script>
  <script src="src/menu/start-menu.js?build=147menu"></script>
</body>
</html>
